name: Publish release image
on:
  workflow_dispatch:
  schedule:
    - cron: '23 9 * * *'
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: folderframe-release
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Validate Docker Compose example
        run: MEDIA_PATH=/tmp/folderframe-media docker compose config --quiet
  publish:
    if: github.event_name != 'push'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Resolve latest published stable release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/resolve_release.py
      - name: Check whether this release and recipe are already published
        if: steps.release.outputs.available == 'true'
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_SHA: ${{ steps.release.outputs.sha }}
          APP_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          ready=false
          if docker pull "$image:stable"; then
            source_sha=$(docker inspect -f '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image:stable")
            recipe_sha=$(docker inspect -f '{{ index .Config.Labels "io.folderframe.deployment-revision" }}' "$image:stable")
            version=$(docker inspect -f '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$image:stable")
            if [[ "$source_sha" == "$APP_SHA" && "$recipe_sha" == "$GITHUB_SHA" && "$version" == "$APP_TAG" ]]; then
              ready=true
            fi
          fi
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
      - name: Fetch app from the release commit
        if: steps.release.outputs.available == 'true' && steps.existing.outputs.ready != 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: The-Grog/FolderFrame
          ref: ${{ steps.release.outputs.sha }}
          path: upstream
          persist-credentials: false
      - name: Build and smoke-test
        if: steps.release.outputs.available == 'true' && steps.existing.outputs.ready != 'true'
        env:
          APP_SHA: ${{ steps.release.outputs.sha }}
          APP_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$APP_SHA" \
            --label "org.opencontainers.image.version=$APP_TAG" \
            --label "io.folderframe.deployment-revision=$GITHUB_SHA" \
            -t folderframe:ci .
          mkdir -p /tmp/folderframe-config
          mkdir -p /tmp/folderframe-media
          python3 - <<'PY'
          import base64
          from pathlib import Path
          Path("/tmp/folderframe-media/smoke.png").write_bytes(base64.b64decode(
              "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII="
          ))
          PY
          docker run -d --name smoke -p 127.0.0.1:8088:8080 \
            -v /tmp/folderframe-config:/config \
            -v /tmp/folderframe-media:/media:ro \
            -e FOLDERFRAME_SOURCE_LABEL=Gallery \
            -e FOLDERFRAME_STARTING_VIEW=all \
            -e FOLDERFRAME_DEFAULT_SORT=oldest \
            -e FOLDERFRAME_SLIDESHOW_INTERVAL=10 \
            -e FOLDERFRAME_IMAGE_MODE=original \
            -e FOLDERFRAME_AUTOPLAY=true \
            -e FOLDERFRAME_SHUFFLE=true \
            -e FOLDERFRAME_GALLERY_REFRESH_INTERVAL=77 \
            -e FOLDERFRAME_EMBED_REFRESH_INTERVAL=88 \
            -e FOLDERFRAME_REMEMBER_PREFERENCES=false \
            folderframe:ci
          trap 'docker logs smoke; docker rm -f smoke' EXIT
          curl --retry 10 --retry-all-errors --retry-delay 1 --retry-max-time 30 --connect-timeout 2 --max-time 5 --fail http://127.0.0.1:8088/ -o /tmp/index.html
          for asset in docs/images/folderframe-logo.png docs/images/folderframe-icon.png styles.css app.js settings.js resilience.js; do
            curl --fail "http://127.0.0.1:8088/$asset" -o /tmp/asset
            test -s /tmp/asset
          done
          curl --fail http://127.0.0.1:8088/photos/ -o /tmp/listing.html
          curl --fail "http://127.0.0.1:8088/app.js?v=smoke-${APP_SHA}" -o /tmp/deployed-app.js
          curl --fail "http://127.0.0.1:8088/index.html?v=smoke-${APP_SHA}" -o /tmp/deployed-index.html
          grep -q 'function cycleGridDensity' /tmp/deployed-app.js
          grep -q 'function setScanProgressBar' /tmp/deployed-app.js
          grep -q 'id="btn-grid-density"' /tmp/deployed-index.html
          grep -q 'id="scan-progress-track"' /tmp/deployed-index.html
          curl --fail http://127.0.0.1:8088/folderframe.config.json -o /tmp/runtime-config.json
          python3 -c 'import json; c=json.load(open("/tmp/runtime-config.json")); assert c["sources"][0]["label"] == "Gallery"; assert c["sources"][0]["thumbnailPath"] == "thumbnails/"; assert c["sources"][0]["manifestPath"] == "folderframe-data/library.json"; assert c["defaults"]["gridDensity"] == "comfortable"; assert c["defaults"] == c["defaults"] | {"view":"all","sort":"oldest","interval":10,"imageMode":"original","autoplay":True,"shuffle":True,"rememberPreferences":False}; assert c["index"]["refreshInterval"] == 77; assert c["embed"]["refreshInterval"] == 88'
          for attempt in $(seq 1 30); do
            test -s /tmp/folderframe-config/thumbnails/smoke.png.webp && test -s /tmp/folderframe-config/folderframe-data/library.json && break
            sleep 1
          done
          test -s /tmp/folderframe-config/thumbnails/smoke.png.webp
          test -s /tmp/folderframe-config/folderframe-data/library.json
          python3 -c 'import json; m=json.load(open("/tmp/folderframe-config/folderframe-data/library.json")); assert m["version"] == 1; assert any(f["path"] == "smoke.png" for f in m["root"]["files"])'
          curl --fail http://127.0.0.1:8088/thumbnails/smoke.png.webp -o /tmp/smoke-thumb.webp
          curl --fail http://127.0.0.1:8088/folderframe-data/library.json -o /tmp/smoke-manifest.json
          test -s /tmp/smoke-thumb.webp
          python3 -c 'import json; c=json.load(open("/tmp/folderframe-config/folderframe.config.json")); assert c["sources"][0]["label"] != "Gallery"; assert c["defaults"]["view"] != "all"'
          docker restart smoke
          curl --retry 10 --retry-all-errors --retry-delay 1 --retry-max-time 30 --fail http://127.0.0.1:8088/folderframe.config.json -o /tmp/restarted-config.json
          cmp /tmp/runtime-config.json /tmp/restarted-config.json
          test -s /tmp/folderframe-config/folderframe-data/library.json
          curl --fail http://127.0.0.1:8088/folderframe-data/library.json -o /tmp/restarted-manifest.json
          if docker run --rm -e FOLDERFRAME_STARTING_VIEW=invalid folderframe:ci true; then
            echo "Invalid override unexpectedly succeeded" >&2
            exit 1
          fi
          if docker run --rm -e FOLDERFRAME_THUMBNAIL_INTERVAL=invalid folderframe:ci true; then
            echo "Invalid thumbnail interval unexpectedly succeeded" >&2
            exit 1
          fi
          for path in .git/config MONETIZATION.md TODO_PRIVATE.md Dockerfile Caddyfile folderframe-data/secret.txt config/folderframe.config.json; do
            test "$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8088/$path")" = 404
          done
      - name: Publish to GHCR
        if: steps.release.outputs.available == 'true' && steps.existing.outputs.ready != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_SHA: ${{ steps.release.outputs.sha }}
          APP_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          for tag in "build-${APP_SHA:0:12}-${GITHUB_SHA:0:12}" "$APP_TAG" test stable; do
            docker tag folderframe:ci "$image:$tag"
            docker push "$image:$tag"
          done
