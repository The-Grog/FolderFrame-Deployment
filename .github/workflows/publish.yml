name: Publish release image
on:
  workflow_dispatch:
  schedule:
    - cron: '23 9 * * *'
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: folderframe-release
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Test streaming with FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python3 -m unittest discover -s scripts -p 'test_transcode_service.py'
      - name: Validate Docker Compose example
        run: MEDIA_LIBRARY_PATH=/tmp/folderframe-library docker compose config --quiet
  publish:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: container-publish
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Resolve latest published stable release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/resolve_release.py
      - name: Check whether this release and recipe are already published
        if: steps.release.outputs.available == 'true'
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_SHA: ${{ steps.release.outputs.sha }}
          APP_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          ready=false
          if docker pull --platform linux/amd64 "$image:stable"; then
            source_sha=$(docker inspect -f '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image:stable")
            recipe_sha=$(docker inspect -f '{{ index .Config.Labels "io.folderframe.deployment-revision" }}' "$image:stable")
            version=$(docker inspect -f '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$image:stable")
            raw_index=$(mktemp)
            if docker buildx imagetools inspect --raw "$image:stable" > "$raw_index" 2>/dev/null && \
              python3 scripts/verify_image_index.py "$raw_index"; then
              platforms_ready=true
            else
              platforms_ready=false
            fi
            if [[ "$source_sha" == "$APP_SHA" && "$recipe_sha" == "$GITHUB_SHA" && "$version" == "$APP_TAG" && "$platforms_ready" == true ]]; then
              ready=true
            fi
          fi
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
      - name: Fetch app from the release commit
        if: steps.release.outputs.available == 'true' && steps.existing.outputs.ready != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: The-Grog/FolderFrame
          ref: ${{ steps.release.outputs.sha }}
          path: upstream
          persist-credentials: false
      - name: Set up QEMU
        if: steps.release.outputs.available == 'true' && steps.existing.outputs.ready != 'true'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64
      - name: Set up Docker Buildx
        if: steps.release.outputs.available == 'true' && steps.existing.outputs.ready != 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GHCR for candidate publication
        if: steps.release.outputs.available == 'true' && steps.existing.outputs.ready != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Prepare lowercase candidate references
        id: candidate_refs
        if: steps.release.outputs.available == 'true' && steps.existing.outputs.ready != 'true'
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          stem="$image:candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "amd64=$stem-amd64" >> "$GITHUB_OUTPUT"
          echo "arm64=$stem-arm64" >> "$GITHUB_OUTPUT"
      - name: Build immutable amd64 candidate
        id: build_amd64
        if: steps.release.outputs.available == 'true' && steps.existing.outputs.ready != 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          pull: true
          push: true
          provenance: false
          tags: ${{ steps.candidate_refs.outputs.amd64 }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.release.outputs.sha }}
            org.opencontainers.image.version=${{ steps.release.outputs.tag }}
            io.folderframe.deployment-revision=${{ github.sha }}
          cache-from: type=gha,scope=folderframe-smoke-amd64
          cache-to: type=gha,mode=max,scope=folderframe-smoke-amd64
      - name: Smoke-test immutable amd64 candidate
        if: steps.release.outputs.available == 'true' && steps.existing.outputs.ready != 'true'
        env:
          APP_SHA: ${{ steps.release.outputs.sha }}
          CANDIDATE_DIGEST: ${{ steps.build_amd64.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}@$CANDIDATE_DIGEST"
          docker pull --platform linux/amd64 "$image"
          scripts/smoke_container.sh "$image" linux/amd64 x86_64 "$APP_SHA"
      - name: Build immutable arm64 candidate
        id: build_arm64
        if: steps.release.outputs.available == 'true' && steps.existing.outputs.ready != 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/arm64
          pull: true
          push: true
          provenance: false
          tags: ${{ steps.candidate_refs.outputs.arm64 }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.release.outputs.sha }}
            org.opencontainers.image.version=${{ steps.release.outputs.tag }}
            io.folderframe.deployment-revision=${{ github.sha }}
          cache-from: type=gha,scope=folderframe-smoke-arm64
          cache-to: type=gha,mode=max,scope=folderframe-smoke-arm64
      - name: Smoke-test immutable arm64 candidate
        if: steps.release.outputs.available == 'true' && steps.existing.outputs.ready != 'true'
        env:
          APP_SHA: ${{ steps.release.outputs.sha }}
          CANDIDATE_DIGEST: ${{ steps.build_arm64.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}@$CANDIDATE_DIGEST"
          docker pull --platform linux/arm64 "$image"
          scripts/smoke_container.sh "$image" linux/arm64 aarch64 "$APP_SHA"
      - name: Assemble and verify candidate image index
        id: candidate
        if: steps.release.outputs.available == 'true' && steps.existing.outputs.ready != 'true'
        env:
          AMD64_DIGEST: ${{ steps.build_amd64.outputs.digest }}
          ARM64_DIGEST: ${{ steps.build_arm64.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          candidate="$image:candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker buildx imagetools create --tag "$candidate" \
            "$image@$AMD64_DIGEST" "$image@$ARM64_DIGEST"
          raw_index=$(mktemp)
          docker buildx imagetools inspect --raw "$candidate" > "$raw_index"
          python3 scripts/verify_image_index.py "$raw_index"
          digest=$(docker buildx imagetools inspect "$candidate" | awk '/^Digest:/ { print $2; exit }')
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Promote verified candidate to release tags
        if: steps.release.outputs.available == 'true' && steps.existing.outputs.ready != 'true'
        env:
          APP_SHA: ${{ steps.release.outputs.sha }}
          APP_TAG: ${{ steps.release.outputs.tag }}
          CANDIDATE_DIGEST: ${{ steps.candidate.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags=("build-${APP_SHA:0:12}-${GITHUB_SHA:0:12}" "$APP_TAG" test stable)
          for tag in "${tags[@]}"; do
            docker buildx imagetools create --tag "$image:$tag" "$image@$CANDIDATE_DIGEST"
            ref="$image:$tag"
            raw_index=$(mktemp)
            docker buildx imagetools inspect --raw "$ref" > "$raw_index"
            python3 scripts/verify_image_index.py "$raw_index"
            digest=$(docker buildx imagetools inspect "$ref" | awk '/^Digest:/ { print $2; exit }')
            test "$digest" = "$CANDIDATE_DIGEST"
          done
      - name: Log out of GHCR
        if: always() && steps.release.outputs.available == 'true' && steps.existing.outputs.ready != 'true'
        run: docker logout ghcr.io
