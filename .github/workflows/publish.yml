name: Publish release image
on:
  workflow_dispatch:
    inputs:
      mirror_existing_ghcr:
        description: Mirror an already verified matching GHCR stable image without rebuilding it
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '23 9 * * *'
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: folderframe-release
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Test streaming with FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python3 -m unittest discover -s scripts -p 'test_transcode_service.py'
      - name: Validate Docker Compose example
        run: MEDIA_LIBRARY_PATH=/tmp/folderframe-library docker compose config --quiet
  publish:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: container-publish
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Resolve latest published stable release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/resolve_release.py
      - name: Check whether this release and recipe are already published
        if: steps.release.outputs.available == 'true'
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_SHA: ${{ steps.release.outputs.sha }}
          APP_TAG: ${{ steps.release.outputs.tag }}
          MIRROR_EXISTING: ${{ github.event.inputs.mirror_existing_ghcr }}
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          ready=false
          source_ready=false
          if docker pull --platform linux/amd64 "$image:stable"; then
            source_sha=$(docker inspect -f '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image:stable")
            recipe_sha=$(docker inspect -f '{{ index .Config.Labels "io.folderframe.deployment-revision" }}' "$image:stable")
            version=$(docker inspect -f '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$image:stable")
            raw_index=$(mktemp)
            if docker buildx imagetools inspect --raw "$image:stable" > "$raw_index" 2>/dev/null && \
              python3 scripts/verify_image_index.py "$raw_index"; then
              platforms_ready=true
            else
              platforms_ready=false
            fi
            if [[ "$source_sha" == "$APP_SHA" && -n "$recipe_sha" && "$version" == "$APP_TAG" && "$platforms_ready" == true ]]; then
              source_ready=true
              if [[ "$recipe_sha" == "$GITHUB_SHA" ]]; then
                ready=true
              fi
            fi
          fi
          build_required=true
          if [[ "$ready" == true || ("$MIRROR_EXISTING" == true && "$source_ready" == true) ]]; then
            build_required=false
          fi
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          echo "source_ready=$source_ready" >> "$GITHUB_OUTPUT"
          echo "build_required=$build_required" >> "$GITHUB_OUTPUT"
      - name: Fetch app from the release commit
        if: steps.release.outputs.available == 'true' && steps.existing.outputs.build_required == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: The-Grog/FolderFrame
          ref: ${{ steps.release.outputs.sha }}
          path: upstream
          persist-credentials: false
      - name: Set up QEMU
        if: steps.release.outputs.available == 'true' && steps.existing.outputs.build_required == 'true'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - name: Set up Docker Buildx
        if: steps.release.outputs.available == 'true' && steps.existing.outputs.build_required == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR for candidate publication
        if: steps.release.outputs.available == 'true' && steps.existing.outputs.build_required == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Prepare lowercase candidate references
        id: candidate_refs
        if: steps.release.outputs.available == 'true' && steps.existing.outputs.build_required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          stem="$image:candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "amd64=$stem-amd64" >> "$GITHUB_OUTPUT"
          echo "arm64=$stem-arm64" >> "$GITHUB_OUTPUT"
      - name: Build immutable amd64 candidate
        id: build_amd64
        if: steps.release.outputs.available == 'true' && steps.existing.outputs.build_required == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          pull: true
          push: true
          provenance: false
          tags: ${{ steps.candidate_refs.outputs.amd64 }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.release.outputs.sha }}
            org.opencontainers.image.version=${{ steps.release.outputs.tag }}
            io.folderframe.deployment-revision=${{ github.sha }}
          cache-from: type=gha,scope=folderframe-smoke-amd64
          cache-to: type=gha,mode=max,scope=folderframe-smoke-amd64
      - name: Smoke-test immutable amd64 candidate
        if: steps.release.outputs.available == 'true' && steps.existing.outputs.build_required == 'true'
        env:
          APP_SHA: ${{ steps.release.outputs.sha }}
          CANDIDATE_DIGEST: ${{ steps.build_amd64.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}@$CANDIDATE_DIGEST"
          docker pull --platform linux/amd64 "$image"
          scripts/smoke_container.sh "$image" linux/amd64 x86_64 "$APP_SHA"
      - name: Build immutable arm64 candidate
        id: build_arm64
        if: steps.release.outputs.available == 'true' && steps.existing.outputs.build_required == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          pull: true
          push: true
          provenance: false
          tags: ${{ steps.candidate_refs.outputs.arm64 }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.release.outputs.sha }}
            org.opencontainers.image.version=${{ steps.release.outputs.tag }}
            io.folderframe.deployment-revision=${{ github.sha }}
          cache-from: type=gha,scope=folderframe-smoke-arm64
          cache-to: type=gha,mode=max,scope=folderframe-smoke-arm64
      - name: Smoke-test immutable arm64 candidate
        if: steps.release.outputs.available == 'true' && steps.existing.outputs.build_required == 'true'
        env:
          APP_SHA: ${{ steps.release.outputs.sha }}
          CANDIDATE_DIGEST: ${{ steps.build_arm64.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}@$CANDIDATE_DIGEST"
          docker pull --platform linux/arm64 "$image"
          scripts/smoke_container.sh "$image" linux/arm64 aarch64 "$APP_SHA"
      - name: Assemble and verify candidate image index
        id: candidate
        if: steps.release.outputs.available == 'true' && steps.existing.outputs.build_required == 'true'
        env:
          AMD64_DIGEST: ${{ steps.build_amd64.outputs.digest }}
          ARM64_DIGEST: ${{ steps.build_arm64.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          candidate="$image:candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker buildx imagetools create --tag "$candidate" \
            "$image@$AMD64_DIGEST" "$image@$ARM64_DIGEST"
          raw_index=$(mktemp)
          docker buildx imagetools inspect --raw "$candidate" > "$raw_index"
          python3 scripts/verify_image_index.py "$raw_index"
          digest=$(docker buildx imagetools inspect "$candidate" | awk '/^Digest:/ { print $2; exit }')
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Promote verified candidate to release tags
        if: steps.release.outputs.available == 'true' && steps.existing.outputs.build_required == 'true'
        env:
          APP_SHA: ${{ steps.release.outputs.sha }}
          APP_TAG: ${{ steps.release.outputs.tag }}
          CANDIDATE_DIGEST: ${{ steps.candidate.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags=("build-${APP_SHA:0:12}-${GITHUB_SHA:0:12}" "$APP_TAG" test stable)
          for tag in "${tags[@]}"; do
            docker buildx imagetools create --tag "$image:$tag" "$image@$CANDIDATE_DIGEST"
            ref="$image:$tag"
            raw_index=$(mktemp)
            docker buildx imagetools inspect --raw "$ref" > "$raw_index"
            python3 scripts/verify_image_index.py "$raw_index"
            digest=$(docker buildx imagetools inspect "$ref" | awk '/^Digest:/ { print $2; exit }')
            test "$digest" = "$CANDIDATE_DIGEST"
          done
      - name: Log out of GHCR
        if: always() && steps.release.outputs.available == 'true' && steps.existing.outputs.build_required == 'true'
        run: docker logout ghcr.io
      - name: Mirror verified GHCR release to Docker Hub
        if: steps.release.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          APP_SHA: ${{ steps.release.outputs.sha }}
          APP_TAG: ${{ steps.release.outputs.tag }}
          MIRROR_EXISTING: ${{ github.event.inputs.mirror_existing_ghcr }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DOCKERHUB_USERNAME"
          test -n "$DOCKERHUB_TOKEN"
          ghcr_image="ghcr.io/${GITHUB_REPOSITORY,,}"
          dockerhub_image="docker.io/${DOCKERHUB_USERNAME}/folderframe"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          printf '%s' "$DOCKERHUB_TOKEN" | docker login docker.io -u "$DOCKERHUB_USERNAME" --password-stdin
          trap 'docker logout ghcr.io; docker logout docker.io' EXIT

          source_ref="$ghcr_image:stable"
          source_raw=$(mktemp)
          docker buildx imagetools inspect --raw "$source_ref" > "$source_raw"
          python3 scripts/verify_image_index.py "$source_raw"
          source_digest=$(docker buildx imagetools inspect "$source_ref" | awk '/^Digest:/ { print $2; exit }')
          test -n "$source_digest"

          docker pull --platform linux/amd64 "$ghcr_image@$source_digest"
          source_sha=$(docker inspect -f '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$ghcr_image@$source_digest")
          recipe_sha=$(docker inspect -f '{{ index .Config.Labels "io.folderframe.deployment-revision" }}' "$ghcr_image@$source_digest")
          version=$(docker inspect -f '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$ghcr_image@$source_digest")
          test "$source_sha" = "$APP_SHA"
          test "$version" = "$APP_TAG"
          test -n "$recipe_sha"
          if [[ "$MIRROR_EXISTING" != true ]]; then
            test "$recipe_sha" = "$GITHUB_SHA"
          fi

          docker buildx imagetools create \
            --tag "$dockerhub_image:latest" \
            --tag "$dockerhub_image:stable" \
            --tag "$dockerhub_image:$APP_TAG" \
            "$ghcr_image@$source_digest"

          mirrored_digest=""
          for tag in latest stable "$APP_TAG"; do
            ref="$dockerhub_image:$tag"
            destination_raw=$(mktemp)
            docker buildx imagetools inspect --raw "$ref" > "$destination_raw"
            python3 scripts/verify_image_index.py "$destination_raw"
            python3 - "$source_raw" "$destination_raw" <<'PY'
          import json
          import sys

          def platform_digests(path):
              payload = json.load(open(path, encoding="utf-8"))
              return {
                  (entry["platform"]["os"], entry["platform"]["architecture"]): entry["digest"]
                  for entry in payload["manifests"]
                  if entry.get("platform", {}).get("os") == "linux"
                  and entry.get("platform", {}).get("architecture") in {"amd64", "arm64"}
              }

          if platform_digests(sys.argv[1]) != platform_digests(sys.argv[2]):
              raise SystemExit("Docker Hub does not reference the verified GHCR platform manifests")
          PY
            digest=$(docker buildx imagetools inspect "$ref" | awk '/^Digest:/ { print $2; exit }')
            test -n "$digest"
            if [[ -z "$mirrored_digest" ]]; then
              mirrored_digest="$digest"
            else
              test "$digest" = "$mirrored_digest"
            fi
          done

          docker pull --platform linux/amd64 "$dockerhub_image@$mirrored_digest"
          mirrored_sha=$(docker inspect -f '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$dockerhub_image@$mirrored_digest")
          mirrored_recipe=$(docker inspect -f '{{ index .Config.Labels "io.folderframe.deployment-revision" }}' "$dockerhub_image@$mirrored_digest")
          mirrored_version=$(docker inspect -f '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$dockerhub_image@$mirrored_digest")
          test "$mirrored_sha" = "$APP_SHA"
          test "$mirrored_recipe" = "$recipe_sha"
          test "$mirrored_version" = "$APP_TAG"
