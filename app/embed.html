<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FolderFrame Embed Example</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 24px;
            background: #f4f4f5;
            color: #18181b;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        main { width: min(1200px, 100%); margin: 0 auto; }
        h1 { margin: 0 0 8px; font-size: clamp(1.5rem, 4vw, 2.25rem); }
        p { margin: 0 0 20px; color: #52525b; }
        .folderframe-embed {
            width: 100%;
            aspect-ratio: 16 / 9;
            min-height: 420px;
            overflow: hidden;
            border-radius: 14px;
            box-shadow: 0 18px 50px rgba(0, 0, 0, .18);
            background: #050505;
        }
        .folderframe-embed iframe {
            display: block;
            width: 100%;
            height: 100%;
            border: 0;
        }
        @media (max-width: 640px) {
            body { padding: 12px; }
            .folderframe-embed { min-height: 70vh; aspect-ratio: auto; }
        }
    </style>
</head>
<body>
    <main>
        <h1>FolderFrame Embed Example</h1>
        <p>Click inside the gallery before using its keyboard shortcuts.</p>
        <div class="folderframe-embed">
            <iframe
                src="./?profile=embed"
                title="FolderFrame photo and video gallery"
                loading="lazy"
                allowfullscreen>
            </iframe>
        </div>
    </main>
</body>
</html>
