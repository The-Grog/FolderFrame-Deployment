services:
  folderframe:
    image: ghcr.io/the-grog/folderframe-deployment:stable
    container_name: folderframe
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8088}:8080"
    volumes:
      - type: bind
        source: ${MEDIA_PATH:?Set MEDIA_PATH in .env to an absolute existing media directory}
        target: /media
        read_only: true
      - type: bind
        source: ${CONFIG_PATH:-./config}
        target: /config
    environment:
      FOLDERFRAME_SOURCE_LABEL: "${FOLDERFRAME_SOURCE_LABEL:-}"
      FOLDERFRAME_STARTING_VIEW: "${FOLDERFRAME_STARTING_VIEW:-}"
      FOLDERFRAME_DEFAULT_SORT: "${FOLDERFRAME_DEFAULT_SORT:-}"
      FOLDERFRAME_SLIDESHOW_INTERVAL: "${FOLDERFRAME_SLIDESHOW_INTERVAL:-}"
      FOLDERFRAME_IMAGE_MODE: "${FOLDERFRAME_IMAGE_MODE:-}"
      FOLDERFRAME_AUTOPLAY: "${FOLDERFRAME_AUTOPLAY:-}"
      FOLDERFRAME_SHUFFLE: "${FOLDERFRAME_SHUFFLE:-}"
      FOLDERFRAME_GALLERY_REFRESH_INTERVAL: "${FOLDERFRAME_GALLERY_REFRESH_INTERVAL:-}"
      FOLDERFRAME_EMBED_REFRESH_INTERVAL: "${FOLDERFRAME_EMBED_REFRESH_INTERVAL:-}"
      FOLDERFRAME_REMEMBER_PREFERENCES: "${FOLDERFRAME_REMEMBER_PREFERENCES:-}"
